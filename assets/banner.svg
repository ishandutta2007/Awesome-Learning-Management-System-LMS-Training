<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Gradient Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .metric-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #f8fafc;
    }

    /* Ambient pulse animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.65; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }

    .orb-glow-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 950px 100px;
    }
    .orb-glow-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 150px 300px;
    }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite 1s; }
    .card-float-3 { animation: floatCard3 8s ease-in-out infinite 0.5s; }
    .stream-line {
      stroke-dasharray: 8, 6;
      animation: dashCycle 20s linear infinite;
    }
  </style>

  <!-- Deep Slate Tech Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern Overlay -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Animated Ambient Nebula Lights (Background) -->
  <g class="orb-glow-1">
    <circle cx="950" cy="90" r="140" fill="#6366f1" opacity="0.35" filter="url(#glow)" />
  </g>
  <g class="orb-glow-2">
    <circle cx="150" cy="300" r="160" fill="#06b6d4" opacity="0.25" filter="url(#glow)" />
    <circle cx="1080" cy="280" r="100" fill="#a855f7" opacity="0.3" filter="url(#glow)" />
  </g>

  <!-- Flow / Stream Connectors (Dynamic background) -->
  <path d="M 500 190 C 650 190, 680 100, 770 100" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" class="stream-line" />
  <path d="M 500 210 C 660 210, 690 185, 770 185" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4" class="stream-line" />
  <path d="M 500 230 C 670 230, 700 270, 770 270" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" class="stream-line" />

  <!-- FOREGROUND: Header Badge -->
  <g transform="translate(60, 48)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#06b6d4" filter="url(#subtleGlow)" />
    <text x="30" y="20" class="badge-text" fill="#38bdf8">ENTERPRISE &amp; FOSS EDTECH</text>
  </g>

  <!-- FOREGROUND: Title & Subtitle -->
  <g transform="translate(60, 120)">
    <text class="title-text" y="0">
      <tspan fill="#ffffff">Awesome LMS &amp; </tspan>
      <tspan fill="url(#accentGrad)">Training Systems</tspan>
    </text>
    <text class="subtitle-text" y="38">
      Curated directory of Learning Management Systems, Corporate Training Platforms,
    </text>
    <text class="subtitle-text" y="64">
      SCORM/xAPI compliant architectures, and Open-Source Virtual Classrooms.
    </text>
  </g>

  <!-- FOREGROUND METRIC CARDS (Right side - floating) -->
  <!-- Card 1: Enterprise Market Scale -->
  <g class="card-float-1" transform="translate(770, 50)">
    <rect width="370" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#subtleGlow)" />
    <circle cx="36" cy="37" r="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="30" y="43" font-size="16" fill="#818cf8">🎓</text>
    <text x="68" y="29" class="metric-label">Global EdTech Market</text>
    <text x="68" y="55" class="metric-value">$25B+ <tspan font-size="13" font-weight="400" fill="#94a3b8">→ $85B+ by 2030 (18% CAGR)</tspan></text>
  </g>

  <!-- Card 2: Standards & Compliance -->
  <g class="card-float-2" transform="translate(770, 140)">
    <rect width="370" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#subtleGlow)" />
    <circle cx="36" cy="37" r="18" fill="#082f49" stroke="#06b6d4" stroke-width="1.5" />
    <text x="29" y="43" font-size="16" fill="#38bdf8">⚡</text>
    <text x="68" y="29" class="metric-label">Standards &amp; Interoperability</text>
    <text x="68" y="55" class="metric-value">SCORM 2004 <tspan font-size="13" font-weight="400" fill="#94a3b8">| xAPI | LTI 1.3 | cmi5</tspan></text>
  </g>

  <!-- Card 3: Open-Source Community -->
  <g class="card-float-3" transform="translate(770, 230)">
    <rect width="370" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#subtleGlow)" />
    <circle cx="36" cy="37" r="18" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" />
    <text x="29" y="43" font-size="16" fill="#c084fc">🌟</text>
    <text x="68" y="29" class="metric-label">Open-Source Ecosystem</text>
    <text x="68" y="55" class="metric-value">45,000+ <tspan font-size="13" font-weight="400" fill="#94a3b8">GitHub Stars across Top Platforms</tspan></text>
  </g>

  <!-- Lower Tech Spec Pill Strip -->
  <g transform="translate(60, 275)">
    <rect width="95" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="47" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#38bdf8" font-weight="600" text-anchor="middle">Corporate LMS</text>
  </g>
  <g transform="translate(165, 275)">
    <rect width="85" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="42" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#818cf8" font-weight="600" text-anchor="middle">Higher Ed</text>
  </g>
  <g transform="translate(260, 275)">
    <rect width="80" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="40" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#a855f7" font-weight="600" text-anchor="middle">AI Tutors</text>
  </g>
  <g transform="translate(350, 275)">
    <rect width="115" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="57" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#34d399" font-weight="600" text-anchor="middle">Self-Hosted FOSS</text>
  </g>
  <g transform="translate(475, 275)">
    <rect width="100" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="50" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#fbbf24" font-weight="600" text-anchor="middle">Multi-Tenant</text>
  </g>
</svg>
